[custom]

; ================================================================
; 公司订阅 · 黑名单模式 · Loyalsoldier 规则集
; 节点: c70s 系列
; 规则来源: https://github.com/Loyalsoldier/clash-rules (每日自动更新)
; 模式: 黑名单 — 默认直连，仅被墙流量走代理
; ================================================================

; ================================================================
; 规则集定义
; ================================================================

; ① 私有网络 & 局域网 → 直连
ruleset=🎯 全球直连,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/private.txt
ruleset=🎯 全球直连,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/lancidr.txt

; ② 广告 & 跟踪 → 拦截
ruleset=🛑 广告拦截,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt

; ③ 常见软件 → 直连
ruleset=🎯 全球直连,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/applications.txt

; ④ Apple & iCloud → 苹果服务
ruleset=🍎 苹果服务,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/apple.txt
ruleset=🍎 苹果服务,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/icloud.txt

; ⑤ Google → 代理
ruleset=🚀 节点选择,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/google.txt

; ⑥ GFW 封锁列表 → 代理
ruleset=🚀 节点选择,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/gfw.txt

; ⑦ Telegram IP → 代理
ruleset=🚀 节点选择,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/telegramcidr.txt

; ⑧ 非中国顶级域名 → 代理
ruleset=🚀 节点选择,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/tld-not-cn.txt

; ⑨ 额外代理列表 → 代理
ruleset=🚀 节点选择,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/proxy.txt

; ⑩ 直连域名列表 → 直连
ruleset=🎯 全球直连,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/direct.txt

; ⑪ 中国 IP 段 → 直连
ruleset=🎯 全球直连,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/cncidr.txt
ruleset=🎯 全球直连,[]GEOIP,CN

; ⑫ 局域网 IP → 直连
ruleset=🎯 全球直连,[]GEOIP,LAN

; ⑬ 兜底
ruleset=🐟 漏网之鱼,[]FINAL

; ================================================================
; 策略组定义 (6 组)
; ================================================================

; 1. 手动选择节点
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🚀 手动切换`[]DIRECT

; 2. 自动选最低延迟节点（匹配所有 c70s 节点）
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50

; 3. Apple + iCloud（默认直连，可切代理或指定节点）
custom_proxy_group=🍎 苹果服务`select`[]DIRECT`[]🚀 节点选择`[]🚀 手动切换`[]♻️ 自动选择

; 4. 广告拦截（默认 REJECT，可放行）
custom_proxy_group=🛑 广告拦截`select`[]REJECT`[]DIRECT

; 5. 直连（默认 DIRECT，可切代理或指定节点）
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择`[]🚀 手动切换`[]♻️ 自动选择

; 6. 兜底（默认代理，可切直连或指定节点）
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]♻️ 自动选择`[]🚀 手动切换`[]DIRECT

; ================================================================
; 节点分组（c70s 系列，按协议/地区）
; ================================================================

; 手动切换入口（可选具体节点组）
custom_proxy_group=🚀 手动切换`select`[]🔯 SS节点`[]🔯 VM节点`[]🔯 日本节点`[]🔯 美国节点`[]🔯 荷兰节点`DIRECT

; 按协议分组
custom_proxy_group=🔯 SS节点`url-test`.*(c70s1|c70s2)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🔯 VM节点`url-test`.*(c70s3|c70s4|c70s5|c70s801)`http://www.gstatic.com/generate_204`300,,50

; 按地区分组
custom_proxy_group=🔯 日本节点`url-test`.*(c70s4)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🔯 美国节点`url-test`.*(c70s3|c70s801)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🔯 荷兰节点`url-test`.*(c70s5)`http://www.gstatic.com/generate_204`300,,50

; ================================================================
; 规则生成选项
; ================================================================

enable_rule_generator=true
overwrite_original_rules=true

; ================================================================
; 使用说明
; ================================================================
; 1. 在 OpenClash 中配置：
;    - 订阅转换：开启
;    - 自定义模板：开启，粘贴此模板内容
;
; 2. 模板特点：
;    - 6 个策略组 + 🚀手动切换 辅助组
;    - Loyalsoldier 规则集每日自动更新
;    - 黑名单模式：默认直连，被墙流量走代理
;    - google.txt 走代理（不直连）
;    - apple + icloud 合并为 🍎苹果服务
;    - 保留原有 c70s 按协议/地区分组
;
; 3. 策略组层级：
;    🚀 节点选择（主组）
;       ├─ ♻️ 自动选择（自动测速，所有节点）
;       ├─ 🚀 手动切换（手动选节点组）
;       │  ├─ 🔯 SS节点 (c70s1, c70s2)
;       │  ├─ 🔯 VM节点 (c70s3-5, c70s801)
;       │  ├─ 🔯 日本节点 (c70s4)
;       │  ├─ 🔯 美国节点 (c70s3, c70s801)
;       │  └─ 🔯 荷兰节点 (c70s5)
;       └─ DIRECT
; ================================================================
